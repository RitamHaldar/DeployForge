<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>DeployForge — Autonomous Self-Healing Cloud Deployment</title>
    <meta name="description" content="DeployForge watches your applications, detects failures in milliseconds, and automatically restores healthy instances before downtime impacts users." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN with DeployForge Design Tokens -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            },
            colors: {
              brand: {
                bg: '#070809',
                surface: '#0B0D10',
                card: '#101216',
                elevated: '#14171C',
                border: 'rgba(255, 255, 255, 0.07)',
                'border-hover': 'rgba(255, 255, 255, 0.15)',
                cyan: '#00F0FF',
                'cyan-dim': 'rgba(0, 240, 255, 0.12)',
                blue: '#0EA5E9',
                emerald: '#10B981',
                'emerald-dim': 'rgba(16, 185, 129, 0.12)',
                amber: '#F59E0B',
                'amber-dim': 'rgba(245, 158, 11, 0.12)',
                rose: '#EF4444',
                'rose-dim': 'rgba(239, 68, 68, 0.12)',
                muted: '#8B9099',
                text: '#F5F5F5'
              },
              surface: {
                100: '#0B0D10',
                200: '#101216',
                300: '#14171C',
              },
              accent: {
                cyan: '#00F0FF',
                blue: '#0EA5E9',
                emerald: '#10B981',
                amber: '#F59E0B',
                rose: '#F43F5E'
              }
            }
          }
        }
      };
    </script>
  </head>
  <body class="bg-brand-bg text-brand-text font-sans antialiased selection:bg-brand-cyan/20 selection:text-brand-cyan overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
