apiVersion: apps/v1
kind: Deployment
metadata:
  name:  auth
  labels:
    name:  auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app:  auth
    spec:
      containers:
      - image:  auth:latest
        imagePullPolicy: IfNotPresent
        name:  auth
        resources:
          limits:
            cpu: "500m"
            memory: "512M"
          requests:
            cpu: "250m"
            memory: "512M"
        env:
          - name: MONGO_URI
            valueFrom:
               secretKeyRef:
                 name:  database
                 key: MONGO_URI
          - name: JWT_TOKEN
            valueFrom:
               secretKeyRef:
                 name:  jwt
                 key: JWT_TOKEN
          - name: GOOGLE_CLIENT_ID
            valueFrom:
               secretKeyRef:
                 name:  google
                 key: GOOGLE_CLIENT_ID
          - name: GOOGLE_CLIENT_SECRET
            valueFrom:
               secretKeyRef:
                 name:  google
                 key: GOOGLE_CLIENT_SECRET
          - name: GOOGLE_CALLBACK_URL
            valueFrom:
               secretKeyRef:
                 name:  google
                 key: GOOGLE_CALLBACK_URL
          - name: GOOGLE_REFRESH_TOKEN
            valueFrom:
               secretKeyRef:
                 name:  google
                 key: GOOGLE_REFRESH_TOKEN
          - name: GITHUB_CLIENT_ID
            valueFrom:
               secretKeyRef:
                 name:  github
                 key: GITHUB_CLIENT_ID
          - name: GITHUB_CLIENT_SECRET
            valueFrom:
               secretKeyRef:
                 name:  github
                 key: GITHUB_CLIENT_SECRET
        livenessProbe:
          httpGet:
            path: /auth/heath
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /auth/heath
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 20
      restartPolicy: Always