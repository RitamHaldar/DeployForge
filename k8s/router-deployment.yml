apiVersion: apps/v1
kind: Deployment
metadata:
  name:  router
  labels:
    name:  router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: router
  template:
    metadata:
      labels:
        app: router
    spec:
      containers:
      - image: router:latest
        name:  router
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: "500m"
            memory: "512M"
          requests:
            cpu: "250m"
            memory: "256M"
        livenessProbe:
          httpGet:
            path: /api/router/health
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/router/ready
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10
      restartPolicy: Always