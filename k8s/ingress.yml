apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frameforge-ingress
  labels:
    app.kubernetes.io/name: frameforge-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: "*.preview.localhost"
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: router-service
                port:
                  number: 80
    - http:
        paths:
          - pathType: Prefix
            path: /api/k8s
            backend:
              service:
                name: heal-service
                port: 
                  number: 80
          - pathType: Prefix
            path: /api/github
            backend:
              service:
                name: heal-service
                port: 
                  number: 80
          - pathType: Prefix
            path: /api/auth
            backend:
              service:
                name: auth-service
                port: 
                  number: 80

