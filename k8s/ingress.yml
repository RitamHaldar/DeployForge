apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frameforge-ingress
  labels:
    app.kubernetes.io/name: frameforge-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
      paths:
      - pathType: Prefix
        path: "/api/k8s"
        backend:
          service:
            name: health-service
            port: 
              number: 80
    - http:
      paths:
      - pathType: Prefix
        path: "/api/github"
        backend:
          service:
            name: health-service
            port: 
              number: 80
    - http:
      paths:
      - pathType: Prefix
        path: "/api/auth"
        backend:
          service:
            name: auth-service
            port: 
              number: 80
