apiVersion: apps/v1
kind: Deployment
metadata:
  name:  heal
  labels:
    name:  heal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heal
  template:
    metadata:
      labels:
        app:  heal
    spec:
      containers:
      - image:  heal:latest
        imagePullPolicy: IfNotPresent
        name:  heal
        resources:
          limits:
            cpu: "250m"
            memory: "512M"
          requests:
            cpu: "250m"
            memory: "256M"
        env:
          - name: MONGO_URI
            valueFrom:
               secretKeyRef:
                 name:  database
                 key: MONGO_URI
          - name: JWT_TOKEN
            valueFrom:
               secretKeyRef:
                 name:  jwt
                 key: JWT_TOKEN
        livenessProbe:
          httpGet:
            path: /api/k8s/heath
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/k8s/heath
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 20
      restartPolicy: Always